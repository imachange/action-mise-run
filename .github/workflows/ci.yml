name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint (TSDoc & TypeScript)
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm test

      - name: Build bundle and verify dist diff
        run: |
          pnpm run build
          git diff --exit-code dist/
